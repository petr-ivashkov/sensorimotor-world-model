defaults:
  - env: tworoom
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

run_dir: null
policy: cem
repeat: 0
output_dir: ${oc.env:REPO_ROOT}/outputs/eval
data_dir: ${oc.env:EXTERNAL_DATA_ROOT,${oc.env:REPO_ROOT}/data/external}
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

world:
  num_envs: ${eval.num_eval}
  frame_skip: 1

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5

solver:
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30
  device: cuda

eval:
  save_video: false
  num_eval: 100
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224

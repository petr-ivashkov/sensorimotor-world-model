# @package _global_

env: ogbcube
env_label: OGBench-Cube

data:
  dataset:
    frameskip: 5
    name: cube_single_expert_train
    cache_dir: ${oc.env:EXTERNAL_DATA_ROOT,${oc.env:REPO_ROOT}/data/external}
    keys_to_load:
      - pixels
      - action
      - observation
    keys_to_cache:
      - action
      - observation
    keys_to_merge:
      proprio: proprio

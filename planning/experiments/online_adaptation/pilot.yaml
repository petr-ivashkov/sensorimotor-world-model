# U-shaped block adaptation; pretrained weights come from original Push-T.
seed: 42
initialization: full  # full, encoder_only, scratch
source_env:
  env_name: swm/PushT-v1
  img_size: 224
  max_episode_steps: 200
  reset_options:
    variation: [agent.start_position, block.start_position, block.angle]
target_change:
  env_name: swm/PushT-U-v0
  reset_options:
    variation: [agent.start_position, block.start_position, block.angle, block.shape]
    variation_values:
      block.shape: 2  # U in this custom environment; T in the original environment.
calibration:
  steps: 200
  min_mean_position_divergence: 1.0
collection:
  policy: weak  # weak uses simulator state; random and cem also supported
  dist_constraint: 100
rounds: 5
episodes_per_round: 16
updates_per_round: 100
replay:
  recent_rounds: null  # null: all target experience collected so far
  source_fraction: 0.0
training:
  learning_rate: 1.0e-5
  weight_decay: 1.0e-3
  precision: bf16
  gradient_clip: 1.0
  batch_size: 64
  num_workers: 4
diagnostics:
  holdout_episodes: 24  # split whole episodes into probe fit / test
  max_clips: 256
  batch_size: 32
  horizons: [1, 3, 5]
  ridge_alpha: 1.0
planning:
  enabled: false  # First inspect collection, representation, and prediction.
  num_tasks: 8
  goal_offset_steps: 25  # pinned evaluator uses actual offset 24
  eval_budget: 50
  plan:
    horizon: 5
    receding_horizon: 5
    action_block: 5
  solver:
    batch_size: 1
    num_samples: 128
    var_scale: 1.0
    n_steps: 10
    topk: 16

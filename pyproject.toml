[project]
name = "sensorimotor-world-model"
version = "0.1.0"
description = "Sensorimotor world models with a joint forward + inverse-dynamics objective"
requires-python = ">=3.12,<3.13"
dependencies = [
    # toy/ — dot-world / sprite experiments (CPU-friendly)
    "torch==2.11.0",
    "pandas>=3.0.1",
    "matplotlib>=3.10.8",
    "pyyaml>=6.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    # planning/ — LeWM-based planning experiments (needs a CUDA GPU to run)
    "stable-worldmodel[train,env]==0.0.6",
    # 1.3.0's `all` extra needs box2d-py, which has no wheel past cp37 and needs swig.
    "gymnasium<1.3",
    "stable-pretraining==0.1.6",
    # Pinned to the checkpoints' training versions; newer transformers renames every ViT parameter.
    "transformers==5.5.0",
    "mujoco==3.6.0",
    "dm-control==1.0.38",
    "lightning==2.6.1",
    "numpy==2.2.6",  # shared with toy/
    "gym-pusht==0.1.6",
    "pymunk<7",
    "opencv-python-headless",
    "einops",
    "hydra-core",
    "omegaconf",
    "wandb",
    "h5py",
    "scikit-learn",
    "tqdm",
    "datasets>=2.0,<3",
    "pyarrow<21",
]

[tool.uv]
package = false
override-dependencies = ["opencv-python-headless"]
constraint-dependencies = ["opencv-python-headless"]
